name: CI
on: [pull_request, push]
permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, intl, mbstring, pdo, zip, gd
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-dist --no-interaction
      - run: composer check

  checks:
    name: Package checks
    runs-on: ubuntu-latest
    needs: php
    if: always()
    steps:
      - name: Require every PHP job to pass
        run: test '${{ needs.php.result }}' = success
